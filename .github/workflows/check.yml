name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: python3 scripts/check.py
      - run: node scripts/test-cli.mjs
      - run: node --check mcp-server/server.js
  # The CLI must start on every Node version people may have active (nvm projects often pin 14/16).
  node-versions:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [14, 16, 18, 20, 22, 24]
        include:
          - { os: windows-latest, node: 20 }
          - { os: macos-latest, node: 20 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-package-lock --no-audit --no-fund   # npm 6 (Node 14) can't read lockfile v3
      - name: Smoke test (version, install hands over, scripted setup, doctor, no config without answers)
        run: |
          set -e
          node bin/spec-driven-dev.cjs --version
          d=$(mktemp -d) && git -C "$d" init -q
          SPEC_DRIVEN_HOME="$d/home" node bin/spec-driven-dev.cjs --yes --tools=cursor,codex --dir="$d" | grep -q "run spec-setup"
          test -f "$d/.cursor/skills/spec-create/SKILL.md"
          test ! -f "$d/.spec-driven.yml"
          SPEC_DRIVEN_HOME="$d/home" node bin/spec-driven-dev.cjs setup --yes --dir="$d"
          node bin/spec-driven-dev.cjs doctor --dir="$d"
          e=$(mktemp -d) && git -C "$e" init -q
          node bin/spec-driven-dev.cjs setup --dir="$e" </dev/null | grep -q "run spec-setup"
          test ! -f "$e/.spec-driven.yml"

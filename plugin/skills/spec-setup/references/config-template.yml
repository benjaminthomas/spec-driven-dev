# .spec-driven.yml — project rules for the spec-driven-dev skills.
# Multi-repo teams: the shared parts (tracker, git, commands, models, effort, risk, context) go in
# {specs_dir}/team.yml (spec-driven-dev team init), so colleagues can join; this file then keeps local paths.
# Written by spec-setup from what it detected + what you confirmed. Edit freely, or re-run
# spec-setup to update it. Every spec-* skill reads this before doing anything else.
version: 1

# single     — one git repo, one app
# monorepo   — one git repo, several apps/packages (pnpm/npm/yarn workspaces, Turborepo, Nx, Go/Cargo workspaces…)
# multi-repo — several separate git repos that change together (this file sits in their shared parent folder)
layout: single

# The repos (multi-repo) or packages (monorepo) the pipeline may touch. Omit for `single`.
# Each entry can override the top-level git/commands settings.
# repos:
#   - path: api                 # relative to this file
#     role: REST API + workers  # one line: what lives here, so investigations know where to look
#     git:
#       base_branch: staging
#     commands:
#       test: npm test
#   - path: web
#     role: React frontend

tracker:
  type: jira                    # jira | github | gitlab | linear | azure-boards | clickup | asana | youtrack | … | none (any tracker your AI tool can reach)
  key: STP                      # ticket key prefix (jira/linear); omit for github/none
  url: https://example.atlassian.net   # site/org/repo URL, if any
  updates: ask                  # move the ticket and post stage comments when a tracker tool is connected: ask | on | off
  screenshots: on               # attach verification screenshots to the final comment (after the last review passes): on | off
  # statuses: { start: In Progress, review: In Review }   # filled from the project's real workflow on first use

usage:
  report: all                   # models and token totals in the final report: all (PR and ticket) | pr | ticket | local (log.md only) | off

git:
  remote: origin
  base_branch: default          # branch work is cut from; "default" = the remote's default branch
  pr_target: default            # branch PRs go into; usually the same as base_branch
  branch_name: "{type}/{ticket}-{slug}"   # placeholders: {ticket} {slug} {type}; e.g. "{ticket}" for bare STP-123
  commit_style: conventional    # conventional (feat: …) | ticket (STP-123: …) | freeform

# Leave a command empty if the project doesn't have it; skills skip what's empty.
commands:
  install: ""
  lint: ""
  typecheck: ""
  test: ""
  build: ""
  dev: ""                       # how spec-verify starts the app
  dev_url: ""                   # where it answers, e.g. http://localhost:3000

# Which model runs each task tier (spec-create rates every task light / standard / deep).
# Values are whatever your tool accepts; "default" means "whatever model the session is using".
# escalate = optional last resort when a deep task still fails review after a fix round.
# Defaults checked against vendor docs on 2026-11-06 — refresh when vendors ship new models.
models:
  claude:            # Claude Code aliases follow the newest model per family on your provider
    light: haiku
    standard: sonnet
    deep: opus
    escalate: fable  # Fable: hardest/long-running work; may bill to usage credits on some plans
  codex:
    light: gpt-6-luna
    standard: gpt-6.1-sol
    deep: gpt-6.1-sol  # same model, higher reasoning effort (see effort:)
    escalate: default
  cursor:            # fast = Cursor's cheaper model, inherit = the chat's model, or a model slug from your plan
    light: fast
    standard: inherit
    deep: inherit
    escalate: default
  antigravity:                  # subagents take a Gemini tier only: flash_lite | flash | pro | inherit
    light: flash
    standard: pro
    deep: pro
    escalate: default
  opencode:                     # provider/model, e.g. anthropic/claude-haiku-5-5; "default" = the session's model
    light: default
    standard: default
    deep: default
    escalate: default

# Effort / reasoning level per tier, for tools that support it (Claude Code, Codex).
effort:
  light: low
  standard: medium
  deep: high
  escalate: xhigh

# GitRisk: historical risk per file from git alone (`spec-driven-dev risk` writes {specs_dir}/context/risk.md).
# Risk = churn × 0.30 + bug_density × 0.35 + fan_out × 0.20 + security × 0.15 (each factor 0–100).
# The weights are a starting hypothesis; calibrate them against your own past bugs.
risk:
  enabled: on                   # on | off — off makes every skill ignore risk (used by risk-eval's A/B)
  since: "2 years ago"          # how much history to score
  weights:
    churn: 0.30                 # how often the file changes, vs the repo's 90th percentile
    bug_density: 0.35           # share of its commits that were bug fixes
    fan_out: 0.20               # how many other files import it, vs the repo's 90th percentile
    security: 0.15              # share of its commits that were security fixes

pipeline:
  # stop        — every stage waits for you (default)
  # run-through — after you approve a spec: implement → verify → review → checkpoint in one go,
  #               stopping at any failure or review blocker. Pushing / opening the PR (spec-ship) always asks first.
  after_approval: stop

# Project memory: {specs_dir}/CONTEXT.md (index, ≤60 lines) + {specs_dir}/context/<area>.md (≤150 each).
context:
  project: existing             # existing (audited) | new (intent recorded) — set by setup
  graph: auto                   # auto = use graphify if installed or graphify-out/ exists | off
  share: all                    # all = commit specs + project memory (recommended) | memory = commit only
                                # CONTEXT.md + context/ | none = ignore the specs folder. risk.md is always ignored.
                                # Change with: spec-driven-dev settings --share=…

specs_dir: specs                # where specs/<feature>/ folders go (relative to this file).
                                # Multi-repo teams: a dedicated specs repo (e.g. soreto-specs) everyone clones.

# {specs_dir}/team-repos.yml — every repo the team works across, shared with the specs. Each developer's
# .spec-driven.yml lists only the repos they have; setup offers the rest with their clone commands.
# repos:
#   - name: reverb-backend
#     url: git@github.com:acme/reverb-backend.git
#     role: REST API and workers
#   - name: reverb-react
#     url: git@github.com:acme/reverb-react.git
#     role: merchant dashboard
